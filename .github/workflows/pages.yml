name: Validate and deploy Daily AI Discovery

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "daily-ai-discovery-pages"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate discovery data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JSON and publishing integrity
        run: node scripts/validate-data.js

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
